[env:esp32da]
platform = espressif32
board = esp32dev
framework = arduino

; Board configuration matching your Visual Micro settings
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv

; Upload settings
upload_speed = 921600
upload_port = COM4
monitor_speed = 115200
monitor_port = COM4

; Build flags
build_flags = 
    -DARDUINO_ESP32_DEVproject
    
    -DESP32
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1

; Library dependencies
lib_deps = 
    thomasfredericks/Bounce2@^2.71
    bblanchon/ArduinoJson@^6.21.0
    fbiego/ESP32Time@^2.0.0

; Use local Libraries folder for ArduinoSort and other custom libraries
lib_extra_dirs = Libraries

; Compiler settings
build_unflags = 
build_type = release
